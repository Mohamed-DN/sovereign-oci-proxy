version: '3.8'

services:
  neronet-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neronet_enterprise_console
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - DATABASE_PATH=/app/data/neronet.db
    volumes:
      - ./data:/app/data
    networks:
      - neronet-isolated-mesh

networks:
  neronet-isolated-mesh:
    driver: bridge
