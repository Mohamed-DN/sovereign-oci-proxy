name: Infrastructure, Terraform & Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
      - v4-staging
    paths:
      - 'terraform/**'
      - 'charts/**'
      - 'k8s/**'
      - 'configs/**'
      - '.github/workflows/infra-validate.yml'
  pull_request:
    branches:
      - main
      - v4-staging
    paths:
      - 'terraform/**'
      - 'charts/**'
      - 'k8s/**'
      - 'configs/**'
      - '.github/workflows/infra-validate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    name: Terraform & OpenTofu Matrix Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - oci
          - aws
          - gcp
          - digitalocean
          - hetzner
          - vultr
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu-version: 1.6.2

      - name: Initialize and Validate Module ${{ matrix.module }}
        run: |
          terraform fmt -check || tofu fmt -check || true
          terraform validate || tofu validate || true

  helm-lint:
    name: Helm Lint & Kubernetes Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint SovereignMesh Helm Chart
        run: |
          if [ -d "charts/sovereign-mesh" ]; then
            echo "Linting Helm chart..."
            helm lint ./charts/sovereign-mesh
            helm template test-instance ./charts/sovereign-mesh > /dev/null
          fi

      - name: Build Kustomize Overlays
        run: |
          if [ -d "k8s/overlays/prod-oci" ]; then
            kustomize build ./k8s/overlays/prod-oci || kubectl kustomize ./k8s/overlays/prod-oci > /dev/null || true
          fi

  cluster-schema-validate:
    name: Unified Multi-Cloud Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Validate Unified Cluster Spec
        run: |
          if [ -f "scripts/gitops/sync_cluster_state.py" ] && [ -f "configs/mesh-cluster.yaml" ]; then
            python3 scripts/gitops/sync_cluster_state.py --config configs/mesh-cluster.yaml --command validate
          fi
