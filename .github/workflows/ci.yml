name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all .sh files
        run: |
          ERRORS=0
          find . -name "*.sh" -not -path "./.git/*" | while read -r file; do
            echo "Checking $file..."
            shellcheck -x -e SC2034,SC2086,SC2155 "$file" || ERRORS=$((ERRORS+1))
          done
          exit $ERRORS

  lint-python:
    name: Lint Python Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check all .py files
        run: |
          ERRORS=0
          find . -name "*.py" -not -path "./.git/*" | while read -r file; do
            echo "Checking $file..."
            python3 -m py_compile "$file" || ERRORS=$((ERRORS+1))
          done
          exit $ERRORS

  secret-scan:
    name: Scan for Leaked Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."
          FOUND=0

          # Check for private keys embedded in the repo
          if grep -rn "BEGIN.*PRIVATE KEY" --exclude-dir=.git . ; then
            echo "CRITICAL: Private key found in repository!"
            FOUND=1
          fi

          # Check for AWS-style access keys (20 uppercase alphanumeric)
          if grep -rnE "AKIA[0-9A-Z]{16}" --exclude-dir=.git . ; then
            echo "CRITICAL: AWS access key found!"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "Please review the above matches and remove real secrets."
            exit 1
          fi
          echo "No secrets detected. Placeholder values (YOUR-*) are safe."
