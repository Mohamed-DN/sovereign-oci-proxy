name: Security Audit, SAST & Vulnerability Scanning

on:
  push:
    branches:
      - main
      - v4-staging
  pull_request:
    branches:
      - main
      - v4-staging
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: "free"

  sast-code-scan:
    name: Semgrep Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Rules
        run: |
          if command -v semgrep &>/dev/null; then
            semgrep scan --config auto --error --skip-unknown-extensions --exclude='.agents' --exclude='.git' .
          else
            echo "semgrep scan --config auto"
          fi

  codeql-analysis:
    name: CodeQL Code Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'python']
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  trivy-security-scan:
    name: Trivy Vulnerability & IaC Misconfiguration Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem & IaC Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

  dependency-audit:
    name: Open Source Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || true
          elif [ -f pyproject.toml ]; then
            pip-audit || true
          else
            echo "No python requirements lockfile found; skipping pip-audit."
          fi

      - name: Set up Go & Run govulncheck
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Go govulncheck
        run: |
          if [ -f go.mod ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck ./... || true
          else
            echo "No go.mod present; skipping govulncheck."
          fi
