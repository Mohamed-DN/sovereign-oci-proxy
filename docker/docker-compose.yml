# ==============================================================================
# Sovereign Proxy v4.0 - Hardened Production Docker Compose
# Location: docker/docker-compose.yml
# ==============================================================================
version: '3.8'

services:
  sovereign-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sovereign-proxy:4.0.0
    container_name: sovereign-edge-node
    restart: unless-stopped

    # Security Hardening & Rootless Profile
    user: "10001:10001"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Port Mappings
    ports:
      - "443:443/tcp"
      - "443:443/udp"
      - "127.0.0.1:8443:8443/tcp"
      - "8080:8080/tcp"

    # Ephemeral In-Memory Mounts for Read-Only Filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /var/log/nginx:rw,noexec,nosuid,size=64m
      - /var/log/xray:rw,noexec,nosuid,size=64m
      - /var/lib/nginx/tmp:rw,noexec,nosuid,size=64m

    # Persistent Data Volumes
    volumes:
      - sovereign_data:/etc/sovereign:rw
      - sovereign_decoy:/var/www/decoy:rw

    # Environment Variables
    environment:
      - CLIENT_UUID=${CLIENT_UUID:-}
      - REALITY_PRIVATE_KEY=${REALITY_PRIVATE_KEY:-}
      - REALITY_SHORT_ID=${REALITY_SHORT_ID:-}
      - ENABLE_SECURITY_DAEMON=1
      - HONEYPOT_PORT=8080

    # Resource Constraints
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

    # Liveness & Readiness Healthcheck
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8443/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sovereign_data:
    driver: local
  sovereign_decoy:
    driver: local
