{{- if .Values.relay.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign.fullname" . }}-relay
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
  {{- with .Values.relay.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.relay.service.type }}
  ports:
    {{- range .Values.relay.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol }}
    {{- end }}
  selector:
    {{- include "sovereign.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: relay
{{- end }}
