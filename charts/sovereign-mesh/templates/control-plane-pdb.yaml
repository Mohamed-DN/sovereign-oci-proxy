{{- if and .Values.controlPlane.enabled .Values.controlPlane.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sovereign.fullname" . }}-control-plane
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  minAvailable: {{ .Values.controlPlane.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "sovereign.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
{{- end }}
