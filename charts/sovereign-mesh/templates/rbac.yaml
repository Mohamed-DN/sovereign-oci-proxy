{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sovereign.serviceAccountName" . }}
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sovereign.fullname" . }}-role
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sovereign.fullname" . }}-binding
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sovereign.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "sovereign.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
