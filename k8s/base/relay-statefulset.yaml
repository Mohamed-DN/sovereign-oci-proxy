apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sovereign-relay
  labels:
    app.kubernetes.io/name: sovereign-mesh
    app.kubernetes.io/component: relay
spec:
  serviceName: sovereign-relay
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-mesh
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-mesh
        app.kubernetes.io/component: relay
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: relay
          image: ghcr.io/mohamed-dn/sovereign-relay:4.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          ports:
            - name: https-derp
              containerPort: 443
              protocol: TCP
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DECOY_DOMAIN
              value: "aws.amazon.com"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/sovereign
      volumes:
        - name: data
          emptyDir: {}
