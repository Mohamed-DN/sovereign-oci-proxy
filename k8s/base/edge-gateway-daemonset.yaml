apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sovereign-edge-gateway
  labels:
    app.kubernetes.io/name: sovereign-mesh
    app.kubernetes.io/component: edge-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-mesh
      app.kubernetes.io/component: edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-mesh
        app.kubernetes.io/component: edge-gateway
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: edge-gateway
          image: ghcr.io/mohamed-dn/sovereign-edge-gateway:4.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          ports:
            - name: socks5-egress
              containerPort: 1080
              protocol: TCP
            - name: http-egress
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
