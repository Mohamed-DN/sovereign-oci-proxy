apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-decoy
  labels:
    app.kubernetes.io/name: sovereign-mesh
    app.kubernetes.io/component: decoy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-mesh
      app.kubernetes.io/component: decoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-mesh
        app.kubernetes.io/component: decoy
    spec:
      containers:
        - name: nginx-decoy
          image: nginx:1.27-alpine
          ports:
            - name: http-decoy
              containerPort: 80
              protocol: TCP
            - name: https-decoy
              containerPort: 8443
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-decoy
  labels:
    app.kubernetes.io/name: sovereign-mesh
    app.kubernetes.io/component: decoy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http-decoy
      protocol: TCP
    - name: https
      port: 8443
      targetPort: https-decoy
      protocol: TCP
  selector:
    app.kubernetes.io/name: sovereign-mesh
    app.kubernetes.io/component: decoy
