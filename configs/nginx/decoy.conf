# ==============================================================================
# Sovereign Proxy v4.0 - Hardened Decoy & Subscription Reverse Proxy
# Location: configs/nginx/decoy.conf
# ==============================================================================

# --- Rate Limiting Zones ---
limit_req_zone $binary_remote_addr zone=decoy_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sub_limit:10m rate=5r/s;

# --- Decoy Server Block (Port 8443) ---
server {
    listen 127.0.0.1:8443 default_server;
    server_name _;

    root /var/www/decoy;
    index index.html index.htm;

    # Hardened Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;
    add_header Server "nginx/1.26.1" always;

    # Rate Limiting Application
    limit_req zone=decoy_limit burst=20 nodelay;
    limit_req_status 429;

    # Decoy Root
    location / {
        try_files $uri $uri/ =404;
    }

    # Decoy Cloud Health API
    location /api/status {
        default_type application/json;
        return 200 '{"status":"healthy","service":"cloud-edge-gateway","version":"4.0.0","uptime":"operational","telemetry":{"active_nodes":12,"latency_ms":18}}';
    }

    # Health Probe
    location /healthz {
        default_type text/plain;
        return 200 'OK';
    }

    # Hide sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}

# --- Subscription Delivery Proxy (Port 8444 -> Upstream 2096) ---
server {
    listen 127.0.0.1:8444;
    server_name _;

    # Hardened Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Strict Rate Limiting on Subscription Endpoints
    limit_req zone=sub_limit burst=10 nodelay;
    limit_req_status 429;

    location /sub/ {
        proxy_pass http://127.0.0.1:2096/sub/;
        proxy_http_version 1.1;

        # Header Sanitization & Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip Internal Server Headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Timeouts & Buffering
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        return 404;
    }
}
