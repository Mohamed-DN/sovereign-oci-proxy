# Sovereign Proxy - Nginx Decoy + Subscription Proxy Configuration
# This file configures two local server blocks:
#   - Port 8443: Decoy site (fake "Cloud Infrastructure Monitor" page)
#   - Port 8444: Subscription proxy (reverse proxy to 3x-ui subscription endpoint)

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sub:10m rate=5r/s;

# Decoy Server - Serves a fake corporate status page to unauthorized visitors
server {
    listen 127.0.0.1:8443;
    server_name _;

    root /var/www/decoy;
    index index.html;

    access_log /var/log/nginx/decoy-access.log;
    error_log /var/log/nginx/decoy-error.log;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # Hide server version
    server_tokens off;

    location / {
        limit_req zone=general burst=50 nodelay;
        try_files $uri $uri/ =404;
    }

    # JSON health endpoint (makes the site look like a real API)
    location /api/status {
        limit_req zone=api burst=20 nodelay;
        default_type application/json;
        return 200 '{"status":"healthy","uptime":"99.98%","timestamp":"$time_iso8601"}';
    }

    # Robots.txt (makes the site look like a real production service)
    location /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /admin/\nDisallow: /api/internal/\n";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 30d;
    }
}

# Subscription Proxy - Reverse proxy to 3x-ui subscription endpoint
server {
    listen 127.0.0.1:8444;
    server_name _;

    access_log /var/log/nginx/sub-access.log;
    error_log /var/log/nginx/sub-error.log;

    location /sub/ {
        limit_req zone=sub burst=10 nodelay;
        proxy_pass http://127.0.0.1:2096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
