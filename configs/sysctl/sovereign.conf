# Sovereign Proxy - Sysctl Kernel Tuning
# Apply with: sudo cp sovereign.conf /etc/sysctl.d/99-sovereign.conf && sudo sysctl --system

# =============================================
# TCP Congestion Control (BBR)
# =============================================
# BBR (Bottleneck Bandwidth and RTT) dramatically improves throughput
# on lossy or high-latency connections (critical for Egypt/China).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# =============================================
# TCP Buffer Tuning
# =============================================
# Increase buffer sizes for high-bandwidth proxy workloads
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# =============================================
# TCP Performance
# =============================================
# Enable TCP Fast Open for both client and server
net.ipv4.tcp_fastopen = 3
# Disable slow start after idle (keeps connections fast)
net.ipv4.tcp_slow_start_after_idle = 0
# Keepalive: detect dead connections faster
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
# Enable MTU probing for better path discovery
net.ipv4.tcp_mtu_probing = 1
# Reduce TIME_WAIT duration
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_max_tw_buckets = 5000

# =============================================
# Connection Limits
# =============================================
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# =============================================
# Security Hardening
# =============================================
# Enable SYN cookies to prevent SYN flood attacks
net.ipv4.tcp_syncookies = 1
# Enable reverse path filtering (anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Ignore ICMP broadcast requests
net.ipv4.icmp_echo_ignore_broadcasts = 1
# Disable ICMP redirects (prevent MITM)
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# =============================================
# Disable IPv6 (Reduces attack surface)
# =============================================
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1
