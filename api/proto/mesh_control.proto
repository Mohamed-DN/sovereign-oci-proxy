syntax = "proto3";

package sovereign.mesh.v4;

option go_package = "github.com/sovereign/proxy/v4/pkg/control;control";

// ==========================================
// Node Registration & Heartbeat
// ==========================================
service MeshControlService {
  // Register node and obtain network routing credentials
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  
  // High-frequency liveness and metrics heartbeat
  rpc NodeHeartbeat(stream NodeHeartbeatRequest) returns (stream NodeHeartbeatResponse);
  
  // Discover available exit bridges matching query criteria
  rpc DiscoverExitBridges(DiscoverBridgesRequest) returns (DiscoverBridgesResponse);
  
  // Request a multi-hop onion circuit path
  rpc BuildCircuitPath(CircuitPathRequest) returns (CircuitPathResponse);
  
  // Report node quality metrics and telemetry
  rpc ReportTelemetry(TelemetryReport) returns (TelemetryAck);

  // Sync active mesh topology
  rpc SyncTopology(TopologySyncRequest) returns (TopologySyncResponse);

  // NetBird Parity RPCs
  rpc SyncRoutes(RouteSyncRequest) returns (RouteSyncResponse);
  rpc SyncACLs(ACLSyncRequest) returns (ACLSyncResponse);
}

enum NodeRole {
  NODE_ROLE_CLIENT_ORIGIN = 0;
  NODE_ROLE_EXIT_BRIDGE   = 1;
  NODE_ROLE_HYBRID        = 2;
  NODE_ROLE_RELAY         = 3;
}

enum IPClassification {
  IP_CLASS_UNKNOWN     = 0;
  IP_CLASS_RESIDENTIAL = 1;
  IP_CLASS_MOBILE_5G   = 2;
  IP_CLASS_DATACENTER  = 3;
}

message Endpoint {
  string ip_address = 1;
  uint32 port       = 2;
  string protocol   = 3; // "udp", "tcp", "ws", "http3"
  bool is_stun_discovered = 4;
}

message BridgeCapability {
  bool enabled                  = 1;
  string country_code           = 2; // ISO 3166-1 alpha-2
  string city                   = 3;
  uint32 asn                    = 4;
  IPClassification ip_class     = 5;
  uint32 max_bandwidth_kbps     = 6;
  uint32 max_concurrent_streams = 7;
  bool allow_udp                = 8;
  bool ac_power_only            = 9;
}

message RegisterNodeRequest {
  bytes static_public_key     = 1; // 32-byte Curve25519 public key
  NodeRole role               = 2;
  repeated Endpoint endpoints = 3;
  string auth_token           = 4;
  string client_version       = 5;
  string os_arch              = 6;
  BridgeCapability capability = 7;
}

message RelayNode {
  string relay_id        = 1;
  string hostname        = 2;
  string region          = 3;
  uint32 tcp_port        = 4;
  uint32 udp_port        = 5;
  bytes public_key       = 6;
  bool supports_http3    = 7;
}

message RegisterNodeResponse {
  string assigned_node_id     = 1;
  string overlay_ipv4         = 2; // e.g. 100.64.0.5
  string overlay_ipv6         = 3; // e.g. fd7a:115c:a1e0::5
  repeated RelayNode relays   = 4;
  uint64 lease_expiration_utc = 5;
  bytes network_psk           = 6; // Pre-shared key for Noise_IKpsk2
}

message PostureAttestationProto {
  string os_name               = 1;
  string os_version            = 2;
  string client_version        = 3;
  string country_code          = 4;
  uint32 asn                   = 5;
  bool disk_encrypted          = 6;
  bool firewall_active         = 7;
  bool is_rootless             = 8;
  uint64 attestation_timestamp = 9;
}

message NodeHeartbeatRequest {
  string node_id                  = 1;
  uint64 sequence_num             = 2;
  repeated Endpoint endpoints     = 3;
  uint32 active_circuits          = 4;
  uint32 tx_bytes_sec             = 5;
  uint32 rx_bytes_sec             = 6;
  uint32 cpu_usage_pct            = 7;
  uint32 memory_usage_mb          = 8;
  uint32 battery_level_pct        = 9;
  bool on_battery_power           = 10;
  PostureAttestationProto posture = 11; // Continuous posture attestation
}

message NodeHeartbeatResponse {
  bool acknowledged            = 1;
  bool force_rekey             = 2;
  bool drain_and_exit          = 3;
  repeated string revoked_keys = 4;
  bool is_quarantined          = 5; // Node failed compliance posture
  string quarantine_reason     = 6;
  uint64 policy_epoch          = 7;
  uint64 route_epoch           = 8;
}

message DiscoverBridgesRequest {
  string client_node_id     = 1;
  string target_country     = 2;
  uint32 target_asn         = 3;
  IPClassification ip_class = 4;
  string explicit_host_id   = 5;
  uint32 limit              = 6;
}

message DiscoveredBridge {
  string node_id              = 1;
  bytes public_key            = 2;
  string overlay_ipv4         = 3;
  repeated Endpoint endpoints = 4;
  BridgeCapability capability = 5;
  double score                = 6;
  uint32 rtt_ms               = 7;
}

message DiscoverBridgesResponse {
  repeated DiscoveredBridge bridges = 1;
}

message CircuitPathRequest {
  string client_node_id     = 1;
  uint32 hop_count          = 2; // 2 or 3 hops
  string target_country     = 3;
  IPClassification ip_class = 4;
}

message CircuitHop {
  uint32 hop_index            = 1;
  string node_id              = 2;
  bytes public_key            = 3;
  repeated Endpoint endpoints = 4;
  string relay_id             = 5;
}

message CircuitPathResponse {
  string circuit_id        = 1;
  repeated CircuitHop hops = 2;
  uint64 expiry_timestamp  = 3;
}

message TelemetryReport {
  string reporter_node_id  = 1;
  string target_node_id    = 2;
  bool direct_p2p_success  = 3;
  uint32 rtt_ms            = 4;
  float packet_loss_pct    = 5;
  uint64 bytes_transferred = 6;
  string error_code        = 7;
}

message TelemetryAck {
  bool recorded = 1;
}

message TopologySyncRequest {
  string node_id       = 1;
  uint64 current_epoch = 2;
}

message NodeInfo {
  string node_id              = 1;
  bytes public_key            = 2;
  NodeRole role               = 3;
  string overlay_ipv4         = 4;
  repeated Endpoint endpoints = 5;
  BridgeCapability capability = 6;
  bool is_healthy             = 7;
  uint64 last_seen_utc        = 8;
}

message TopologySyncResponse {
  uint64 new_epoch            = 1;
  repeated NodeInfo nodes     = 2;
  repeated RelayNode relays   = 3;
}

// ==========================================
// Network Route Distribution Protobufs
// ==========================================

message RouteGatewayProto {
  string node_id     = 1;
  uint32 priority    = 2;
  bool is_healthy    = 3;
  double latency_rtt = 4;
}

message SubnetRouteProto {
  string route_id                     = 1;
  string network_id                   = 2;
  string network_cidr                 = 3; // e.g. "10.100.0.0/24"
  bool masquerade                     = 4;
  string failover_mode                = 5; // "ACTIVE_PASSIVE" or "ACTIVE_ACTIVE_ECMP"
  repeated RouteGatewayProto gateways = 6;
}

message RouteSyncRequest {
  string node_id     = 1;
  uint64 route_epoch = 2;
}

message RouteSyncResponse {
  uint64 new_route_epoch           = 1;
  repeated SubnetRouteProto routes = 2;
}

// ==========================================
// Dynamic Peer ACL Protobufs
// ==========================================

message PortRangeProto {
  uint32 start = 1;
  uint32 end   = 2;
}

message CompiledFilterRuleProto {
  string allowed_peer_vip       = 1;
  string protocol               = 2; // "TCP", "UDP", "ICMP", "ALL"
  repeated PortRangeProto ports = 3;
  string action                 = 4; // "ACCEPT", "DROP"
  bool is_directional           = 5;
}

message ACLSyncRequest {
  string node_id      = 1;
  uint64 policy_epoch = 2;
}

message ACLSyncResponse {
  uint64 new_policy_epoch                         = 1;
  repeated CompiledFilterRuleProto inbound_rules  = 2;
  repeated CompiledFilterRuleProto outbound_rules = 3;
}
